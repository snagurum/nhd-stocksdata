spring.application.name=nhd-stocksdata
server.port=8082
server.servlet.context-path=/stocks

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DB:nse}?reWriteBatchedInserts=true
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PWD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=nse

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=nse
spring.liquibase.liquibase-schema=nse

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{20} : %msg%n

stocksdata.pagination-page-size=2000
stocksdata.api-stock-stats-page-size=1000
stocksdata.persistence-jdbc-batch-size=10000
